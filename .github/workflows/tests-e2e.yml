name: tests-e2e

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: 22
  PNPM_VERSION: 10.13.1
  VK_CHECKOUT: vibe-kanban
  GH_TOKEN: ${{ secrets.VK_RELEASE_REPOSITORY_TOKEN || github.token }}

jobs:
  tests-e2e:
    name: tests-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout VD
        uses: actions/checkout@v4
        with:
          path: vibe-kanban-vscode-web

      - name: Record VK content hash
        id: vk-meta
        working-directory: vibe-kanban-vscode-web
        shell: bash
        run: |
          set -euo pipefail
          hash="$(.github/scripts/vk-content-hash.sh)"
          echo "content_hash=$hash" >> "$GITHUB_OUTPUT"
          echo "VK_MOCKED_CONTENT_HASH=$hash" >> "$GITHUB_ENV"
          echo "VK content hash: $hash"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: vibe-kanban-vscode-web/pnpm-lock.yaml

      - name: Setup Go for Caddy
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.7
          cache: false

      - name: Build custom Caddy
        working-directory: vibe-kanban-vscode-web
        shell: bash
        run: |
          set -euo pipefail
          scripts/build-custom-caddy.sh caddy-module .tmp/custom-caddy/caddy
          echo "$PWD/.tmp/custom-caddy" >> "$GITHUB_PATH"

      - name: Install VD dependencies
        working-directory: vibe-kanban-vscode-web
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: vibe-kanban-vscode-web
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate VK mocked sandbox fixture
        working-directory: vibe-kanban-vscode-web
        run: npm run e2e:vk-mocked-sandbox:validate -- --variant basic-seeded

      - name: Run VK mocked sandbox e2e
        working-directory: vibe-kanban-vscode-web
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-run-vk-mocked-sandbox-e2e.sh

      - name: Upload VK mocked sandbox artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vk-mocked-sandbox-artifacts
          path: |
            vibe-kanban-vscode-web/playwright-report
            vibe-kanban-vscode-web/test-results
            vibe-kanban-vscode-web/.vk-mocked-sandbox/current
          if-no-files-found: ignore
