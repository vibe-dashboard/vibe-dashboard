name: Docker workspace beads smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-workspace-beads-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  NODE_VERSION: 22
  PNPM_VERSION: 10.13.1
  RUST_TOOLCHAIN: nightly-2025-12-04
  VK_REPOSITORY: mickmister/vibe-kanban

jobs:
  workspace-beads:
    name: workspace-scoped beads initialization
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Resolve matching VK branch
        id: resolve-vk-ref
        shell: bash
        run: |
          set -euo pipefail
          candidate="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          vk_repo_url="https://github.com/${VK_REPOSITORY}.git"

          if git ls-remote --exit-code --heads "$vk_repo_url" "$candidate" >/dev/null; then
            vk_ref="$candidate"
            reason="matched branch"
          else
            vk_ref="main"
            reason="fallback"
          fi

          echo "ref=$vk_ref" >> "$GITHUB_OUTPUT"
          echo "Resolved VK ref: $vk_ref ($reason for candidate: $candidate)"

      - name: Checkout VD
        uses: actions/checkout@v4
        with:
          path: vibe-kanban-vscode-web

      - name: Checkout VK
        uses: actions/checkout@v4
        with:
          repository: ${{ env.VK_REPOSITORY }}
          ref: ${{ steps.resolve-vk-ref.outputs.ref }}
          path: Vktest

      - name: Record VK commit
        id: vk-meta
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git -C Vktest rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git -C Vktest log --oneline -1

      - name: Free up disk space
        uses: insightsengineering/disk-space-reclaimer@v1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          docker-images: true
          tools-cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: Vktest/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Restore Rust caches
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: Vktest
          shared-key: workspace-beads-docker-${{ runner.os }}-${{ runner.arch }}-${{ steps.vk-meta.outputs.sha }}
          cache-provider: github
          cache-on-failure: "true"

      - name: Install VK dependencies
        working-directory: Vktest
        run: pnpm install --frozen-lockfile

      - name: Build real VK runtime
        working-directory: Vktest
        run: cargo build --locked -p server --bin server
        env:
          VK_BUILD_COMMIT_HASH: ${{ steps.vk-meta.outputs.sha }}

      - name: Stage VK runtime for Docker build
        shell: bash
        run: |
          set -euo pipefail
          cp Vktest/target/debug/server vibe-kanban-vscode-web/.docker/vk-runtime/vibe-kanban
          chmod 0755 vibe-kanban-vscode-web/.docker/vk-runtime/vibe-kanban

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build vkvd image with real VK runtime
        uses: docker/build-push-action@v6
        with:
          context: vibe-kanban-vscode-web
          file: vibe-kanban-vscode-web/Dockerfile.vkvd
          build-args: |
            VK_RUNTIME_SOURCE=local
            VK_COMMIT=${{ steps.vk-meta.outputs.sha }}
          push: false
          load: true
          tags: vk-vd-workspace-beads-smoke:${{ github.sha }}

      - name: Run workspace beads runtime smoke
        working-directory: vibe-kanban-vscode-web
        env:
          VKVD_SMOKE_IMAGE: vk-vd-workspace-beads-smoke:${{ github.sha }}
        run: bash scripts/smoke-vkvd-workspace-beads.sh
