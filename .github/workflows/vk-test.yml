name: VK Test

on:
  push:
    branches:
      - "**"
    paths:
      - vibe-kanban/**
      - .github/workflows/vk-test.yml
      - .github/actions/vk-*/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: 22
  PNPM_VERSION: 10.13.1
  RUST_TOOLCHAIN: nightly-2025-12-04
  RUNNER_LABEL: &runner_label ubuntu-24.04
  ESLINT_USE_FLAT_CONFIG: "false"

defaults:
  run:
    working-directory: vibe-kanban

jobs:
  changes:
    runs-on: *runner_label
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      backend-remote: ${{ steps.filter.outputs['backend-remote'] }}
      tauri: ${{ steps.filter.outputs.tauri }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@0bc4621a3135347011ad047f9ecf449bf72ce2bd # v3.0.0
        id: filter
        with:
          filters: |
            frontend:
              - 'vibe-kanban/**'
              - '.github/workflows/vk-test.yml'
              - '.github/actions/vk-*/**'
            backend:
              - 'vibe-kanban/**'
              - '.github/workflows/vk-test.yml'
              - '.github/actions/vk-*/**'
            backend-remote:
              - 'vibe-kanban/**'
              - '.github/workflows/vk-test.yml'
              - '.github/actions/vk-*/**'
            tauri:
              - 'vibe-kanban/**'
              - '.github/workflows/vk-test.yml'
              - '.github/actions/vk-*/**'

  frontend-checks:
    needs: changes
    if: always() && (needs.changes.outputs.frontend == 'true' || needs.changes.result == 'skipped')
    runs-on: *runner_label
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: ./.github/actions/vk-setup-node

      - name: Install dependencies
        run: pnpm install

      - name: Run frontend checks
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          npx concurrently \
            --kill-others-on-fail \
            --names "local:lint,local:fmt,local:build,remote:fmt,remote:build,ui:check,ui:lint,ui:fmt,core:check,core:fmt,i18n,i18n:unused,legacy" \
            --timings \
            "cd packages/local-web && npm run lint" \
            "cd packages/local-web && npm run format:check" \
            "cd packages/local-web && npm run build" \
            "cd packages/remote-web && npm run format:check" \
            "cd packages/remote-web && npm run build" \
            "cd packages/ui && npm run check" \
            "cd packages/ui && npm run lint" \
            "cd packages/ui && npm run format:check" \
            "cd packages/web-core && npm run check" \
            "cd packages/web-core && npm run format:check" \
            "GITHUB_BASE_REF=${{ github.base_ref || 'main' }} ./scripts/check-i18n.sh" \
            "node scripts/check-unused-i18n-keys.mjs" \
            "./scripts/check-legacy-frontend-paths.sh"

  frontend-tests:
    needs: changes
    if: always() && (needs.changes.outputs.frontend == 'true' || needs.changes.result == 'skipped')
    runs-on: *runner_label
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: ./.github/actions/vk-setup-node

      - name: Install dependencies
        run: pnpm install

      - name: Run web-core Vitest suite
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm run web-core:test

  backend-schema-checks:
    needs: changes
    if: always() && (needs.changes.outputs.backend == 'true' || needs.changes.result == 'skipped')
    runs-on: *runner_label
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v6

      - name: Free up disk space
        uses: insightsengineering/disk-space-reclaimer@v1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true
          docker-images: true
          tools-cache: false

      - name: Setup Rust
        uses: ./.github/actions/vk-cargo-checks-common-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache-key: backend-schema-checks-${{ runner.os }}-${{ runner.arch }}-${{ env.RUNNER_LABEL }}
          setup-node: "true"
          setup-sqlx-cli: "true"

      - name: Check generated types
        run: npm run generate-types:check

      - name: Sqlx checks
        run: npm run prepare-db:check

  backend-clippy:
    needs: changes
    if: always() && (needs.changes.outputs.backend == 'true' || needs.changes.result == 'skipped')
    runs-on: *runner_label
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v6

      - name: Free up disk space
        uses: insightsengineering/disk-space-reclaimer@v1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true
          docker-images: true
          tools-cache: false

      - name: Setup Rust
        uses: ./.github/actions/vk-cargo-checks-common-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          cache-key: backend-clippy-${{ runner.os }}-${{ runner.arch }}-${{ env.RUNNER_LABEL }}

      - name: Run Clippy and fmt checks
        run: |
          set -x
          cargo fmt --all -- --check & pid_fmt=$!
          cargo clippy --workspace --all-targets --exclude vibe-kanban-tauri -- -D warnings
          wait $pid_fmt

  backend-test:
    needs: changes
    if: always() && (needs.changes.outputs.backend == 'true' || needs.changes.result == 'skipped')
    runs-on: *runner_label
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v6

      - name: Free up disk space
        uses: insightsengineering/disk-space-reclaimer@v1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true
          docker-images: true
          tools-cache: false

      - name: Setup Rust
        uses: ./.github/actions/vk-cargo-checks-common-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache-key: backend-test-${{ runner.os }}-${{ runner.arch }}-${{ env.RUNNER_LABEL }}

      - name: Install cargo-nextest
        uses: taiki-e/cache-cargo-install-action@34ce5120836e5f9f1508d8713d7fdea0e8facd6f # v3.0.1
        with:
          tool: cargo-nextest
          git: https://github.com/nextest-rs/nextest
          rev: 6e4a9d6f2c4964f30ff54a8cd5466f8869267daa # cargo-nextest-0.9.132

      - name: Run Cargo tests
        run: cargo nextest run --workspace --exclude vibe-kanban-tauri

  coding-agent-upgrade-gate:
    name: Coding-agent upgrade gate
    runs-on: *runner_label
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check whether coding-agent upgrade gate should run
        id: should_run
        run: |
          result="$(bash scripts/ci/should-run-agent-upgrade-gate.sh)"
          echo "result=${result}" >> "$GITHUB_OUTPUT"

      - name: Coding-agent upgrade gate no-op
        if: steps.should_run.outputs.result != 'true'
        run: |
          echo "Coding-agent upgrade gate: no relevant files changed; no-op pass."

      - name: Setup Rust and Node
        if: steps.should_run.outputs.result == 'true'
        uses: ./.github/actions/vk-cargo-checks-common-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache-key: coding-agent-upgrade-gate-${{ runner.os }}-${{ runner.arch }}-${{ env.RUNNER_LABEL }}
          setup-node: "true"

      - name: Install dependencies
        if: steps.should_run.outputs.result == 'true'
        run: pnpm install

      - name: Run coding-agent upgrade gate
        if: steps.should_run.outputs.result == 'true'
        run: pnpm run agent-upgrade-gate
